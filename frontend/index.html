<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-black.png" />
    <meta name="description" content="Pathly: a URL shortener with custom aliases, expiring links and click analytics." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathly</title>
    <script>
      // Apply the saved or system theme before first paint
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("theme"); } catch (e) {}
        var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0a0a0a");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
